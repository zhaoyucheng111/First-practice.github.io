<!DOCTYPE html>
<html lang="zh-cn">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO List</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 0; display:flex; justify-content:center; }
        .container { max-width: 720px; width: 100%; padding: 24px; box-sizing: border-box; }
        header { text-align: center; margin-bottom: 18px; }
        h1 { margin: 0 0 6px 0; }
        .type-label { margin-bottom: 6px; font-size:14px; color:#444; text-align:left; }
        .type-controls { display:flex; gap:10px; justify-content:space-between; margin-bottom:16px; }
        .type-btn { width:calc(50% - 5px); padding:10px 18px; font-size:14px; border:2px solid transparent; border-radius:999px; background:#fff; color:#111; cursor:pointer; transition: background 0.2s, border-color 0.2s, transform 0.2s; }
        .type-btn:hover { transform: translateY(-1px); }
        .type-btn.selected { color:#111; }
        .type-btn.personal { border-color:#d33; background:#fff5f5; }
        .type-btn.business { border-color:#1565c0; background:#eff5ff; }
        .type-btn.personal.selected { background:#f7d7d7; }
        .type-btn.business.selected { background:#d7e4ff; }
        .controls { display:flex; gap:8px; margin-bottom:12px; }
        input[type="text"] { flex:1; padding:8px 10px; font-size:16px; border:1px solid #ccc; border-radius:999px; }
        button { padding:8px 12px; font-size:14px; cursor:pointer; border-radius:999px; border:1px solid #ccc; background:#f5f5f5; }
        button:hover { background:#e8e8e8; }
        form#todosForm { border-top:1px solid #eee; padding-top:12px; }
        .todo-item { display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid #f3f3f3; border-left:4px solid transparent; border-radius:8px; margin-bottom:6px; cursor:pointer; }
        .todo-item.personal { border-left-color:#d33; background:#feeaea; }
        .todo-item.business { border-left-color:#1565c0; background:#e7f0ff; }
        .todo-item.selected.personal { background:#f5c7c7; }
        .todo-item.selected.business { background:#c5d8ff; }
        .todo-item label { flex:1; word-break:break-word; }
        .todo-item.completed label { text-decoration: line-through; color:#888; }
        .actions { margin-top:12px; display:flex; gap:8px; }
        .muted { color:#666; font-size:13px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>待办清单</h1>
            <div class="muted">输入事项并点击“添加”，直接点击事件行进行选中，支持多选删除。</div>
        </header>

        <div class="controls" role="region" aria-label="添加待办">
            <input id="todoInput" type="text" placeholder="输入将要做的事情" aria-label="待办输入框" />
            <button id="addBtn">添加</button>
            <button id="clearInputBtn" title="清空输入">清空</button>
        </div>

        <div class="type-label">选择一个类别</div>
        <div class="type-controls" role="group" aria-label="选择事件类型">
            <button type="button" id="personalBtn" class="type-btn personal selected">个人</button>
            <button type="button" id="businessBtn" class="type-btn business">商务</button>
        </div>

        <form id="todosForm">
            <div id="todoList" aria-live="polite"></div>
            <div class="actions">
                <button type="button" id="deleteBtn">删除选中</button>
                <button type="button" id="selectAllBtn">全选/取消</button>
            </div>
        </form>
    </div>

    <script>
        const input = document.getElementById('todoInput');
        const addBtn = document.getElementById('addBtn');
        const clearInputBtn = document.getElementById('clearInputBtn');
        const todoListEl = document.getElementById('todoList');
        const deleteBtn = document.getElementById('deleteBtn');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const personalBtn = document.getElementById('personalBtn');
        const businessBtn = document.getElementById('businessBtn');

        const STORAGE_KEY = 'todoListData';
        let todos = [];
        let allSelected = false;
        let selectedType = 'personal';

        function saveTodos() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        }

        function loadTodos() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (!data) return;
            try {
                const parsed = JSON.parse(data);
                if (Array.isArray(parsed)) {
                    todos = parsed.map(item => ({
                        text: String(item.text || ''),
                        type: item.type === 'business' ? 'business' : 'personal',
                        selected: !!item.selected,
                        done: !!item.done
                    }));
                }
            } catch (error) {
                console.warn('无法加载待办数据:', error);
            }
        }

        function setType(type) {
            selectedType = type;
            personalBtn.classList.toggle('selected', type === 'personal');
            businessBtn.classList.toggle('selected', type === 'business');
        }

        function render() {
            todoListEl.innerHTML = '';
            if (todos.length === 0) {
                todoListEl.innerHTML = '<p class="muted">当前没有待办</p>';
                return;
            }
            todos.forEach((t, i) => {
                const item = document.createElement('div');
                item.className = 'todo-item ' + (t.type === 'business' ? 'business' : 'personal') + (t.selected ? ' selected' : '') + (t.done ? ' completed' : '');

                item.addEventListener('click', () => {
                    todos[i].selected = !todos[i].selected;
                    saveTodos();
                    render();
                });

                const label = document.createElement('label');
                label.textContent = t.text + (t.type === 'business' ? '（商务）' : '（个人）');

                item.appendChild(label);

                todoListEl.appendChild(item);
            });
        }

        function addTodo() {
            const text = input.value.trim();
            if (!text) return;
            todos.push({ text, type: selectedType, selected: false, done: false });
            input.value = '';
            render();
            saveTodos();
            input.focus();
        }

        personalBtn.addEventListener('click', () => setType('personal'));
        businessBtn.addEventListener('click', () => setType('business'));

        addBtn.addEventListener('click', addTodo);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addTodo(); } });
        clearInputBtn.addEventListener('click', () => { input.value = ''; input.focus(); });

        deleteBtn.addEventListener('click', () => {
            const toRemove = todos.filter(t => t.selected);
            if (toRemove.length === 0) return alert('请先选择要删除的事项');
            todos = todos.filter(t => !t.selected);
            render();
            saveTodos();
        });

        selectAllBtn.addEventListener('click', () => {
            allSelected = !allSelected;
            todos = todos.map(t => ({ ...t, selected: allSelected }));
            render();
            saveTodos();
        });

        loadTodos();
        render();
    </script>
</body>
</html>
